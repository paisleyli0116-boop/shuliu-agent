[project]
name = "shuliu-foundation-workspace"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pyinstaller==6.22.3",
    "pytest>=8.3",
]

[tool.uv]
package = false
required-version = "==0.12.20"

[tool.uv.workspace]
members = ["services/cloud-api", "runtimes/python-worker"]

[tool.pytest.ini_options]
pythonpath = ["runtimes/python-worker", "services/cloud-api"]
markers = [
    "real_browser: launches real Chrome through the separately locked browser-use driver",
    "integration: exercises multiple Foundation persistence adapters",
    "migration: validates database migrations and migration state",
    "real_embedding: explicitly opted-in real Provider embedding integration; excluded from standard integration runs",
]
