[project]
name = "shuliu-browser-driver"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["browser-use==0.13.11"]

[tool.uv]
package = false
required-version = "==0.12.20"

# Deliberately separate dependency universe: Browser Harness pins websockets 15,
# while the established Cloud/Worker transport requires websockets >=16,<18.
[tool.uv.workspace]
members = []
