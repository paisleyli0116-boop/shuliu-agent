name: Windows Validation

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  windows-validation:
    name: Windows-only build and installer toolchain
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version-file: pyproject.toml
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --all-packages
      - name: Run Windows Computer Runtime contract and interactive-session tests
        env:
          SHULIU_REQUIRE_INTERACTIVE_COMPUTER: "1"
        run: uv run --locked --package shuliu-python-runtime pytest runtimes/python-worker/tests/computer tests/e2e/windows -q -rs --junitxml=computer-tests.xml
      - name: Save Windows Computer Runtime test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: computer-runtime-windows
          path: computer-tests.xml
      - name: Install separately locked browser-use driver
        run: uv sync --locked --project runtimes/browser-driver --python 3.11
      - name: Run Browser Runtime and real Windows Chrome integration tests
        env:
          SHULIU_REQUIRE_REAL_BROWSER: "1"
        run: uv run --locked --all-packages pytest runtimes/python-worker/tests/browser tests/integration/test_browser_tool_policy.py -q --junitxml=browser-tests.xml
      - name: Save real browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-tests-windows
          path: browser-tests.xml
      - name: Run Python Skill process isolation tests
        run: uv run --locked --package shuliu-python-runtime pytest runtimes/python-worker/tests/skills -q
      - name: Run Windows sandbox fail-closed validation
        run: uv run --locked --package shuliu-python-runtime pytest runtimes/python-worker/tests/skills/platform -q
      - name: Run repository security tests
        run: pnpm test:security
      - name: Run Electron ↔ Python IPC tests with real subprocesses
        run: pnpm test:ipc
      - name: Run Desktop UI, IPC, and security unit tests
        run: pnpm --filter @shuliu/desktop test
      - name: Typecheck Electron Main, Preload, and Renderer
        run: pnpm --filter @shuliu/desktop typecheck
      - name: Build unpackaged Desktop Main, Preload, and Renderer
        run: pnpm --filter @shuliu/desktop build
      - name: Validate Windows packaging tools
        shell: pwsh
        run: |
          python -m pip install pyinstaller
          choco install nsis --yes --no-progress
          pyinstaller --version
          & 'C:\Program Files (x86)\NSIS\makensis.exe' /VERSION
      - name: Confirm Windows runner
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -ne "Windows") { throw "Windows-only validation ran on the wrong runner" }
          Write-Output "Windows toolchain verified; runtime, installer upgrade, and rollback smoke tests are added in Tasks 25-27."
