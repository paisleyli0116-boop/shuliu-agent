name: Windows Validation

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  windows-validation:
    name: Windows-only build, install, upgrade, rollback, and runtime validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify installed-health diagnostic sanitization
        shell: pwsh
        run: pwsh -NoProfile -File tests/e2e/windows/test_health_probe_diagnostics.ps1
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version-file: pyproject.toml
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --all-packages
      - name: Run Windows Computer Runtime contract and interactive-session tests
        env:
          SHULIU_REQUIRE_INTERACTIVE_COMPUTER: "1"
        run: uv run --locked --package shuliu-python-runtime pytest runtimes/python-worker/tests/computer tests/e2e/windows -q -rs --junitxml=computer-tests.xml
      - name: Save Windows Computer Runtime test report
        if: always()
        # Evidence upload only: never block the validation chain on artifact
        # storage quota (GitHub recalculates usage every 6-12 hours).
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: computer-runtime-windows
          path: computer-tests.xml
          if-no-files-found: warn
      - name: Install separately locked browser-use driver
        run: uv sync --locked --project runtimes/browser-driver --python 3.11
      - name: Run Browser Runtime and real Windows Chrome integration tests
        env:
          SHULIU_REQUIRE_REAL_BROWSER: "1"
        run: uv run --locked --all-packages pytest runtimes/python-worker/tests/browser tests/integration/test_browser_tool_policy.py -q --junitxml=browser-tests.xml
      - name: Save real browser test evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: browser-tests-windows
          path: browser-tests.xml
          if-no-files-found: warn
      - name: Run Python Skill process isolation tests
        run: uv run --locked --package shuliu-python-runtime pytest runtimes/python-worker/tests/skills -q
      - name: Run Windows sandbox fail-closed validation
        run: uv run --locked --package shuliu-python-runtime pytest runtimes/python-worker/tests/skills/platform -q
      - name: Run repository security tests
        run: pnpm test:security
      - name: Run Electron ↔ Python IPC tests with real subprocesses
        run: pnpm test:ipc
      - name: Run Task 26 update, signature, health-probe, and packaging tests
        shell: pwsh
        run: |
          corepack pnpm --filter @shuliu/desktop exec vitest run --root . tests/update tests/ipc/sidecar-launch.test.ts --reporter=default --reporter=junit --outputFile "$env:RUNNER_TEMP\task26-desktop-tests.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Desktop UI, IPC, and security unit tests
        run: pnpm --filter @shuliu/desktop test
      - name: Run Electron native safeStorage platform smoke (Windows DPAPI)
        run: pnpm --filter @shuliu/desktop test:secure-storage-platform
      - name: Typecheck Electron Main, Preload, and Renderer
        run: pnpm --filter @shuliu/desktop typecheck
      - name: Build Electron Main, Preload, and Renderer
        run: pnpm --filter @shuliu/desktop build
      - name: Build standalone Windows Python Sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:RUNNER_TEMP "task26-pyinstaller.log"
          uv run --locked pyinstaller --noconfirm --clean --distpath runtimes/python-worker/dist --workpath runtimes/python-worker/build apps/desktop/build/windows.spec *> $log
          if ($LASTEXITCODE -ne 0) { Get-Content -LiteralPath $log -Tail 100; exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath "runtimes/python-worker/dist/ShuLiuRuntime.exe")) { throw "PYINSTALLER_OUTPUT_MISSING" }
      - name: Build installable Windows NSIS packages for upgrade and rollback
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $v1 = Join-Path $env:RUNNER_TEMP "task26-installer-v1"
          $v2 = Join-Path $env:RUNNER_TEMP "task26-installer-v2"
          New-Item -ItemType Directory -Path $v1, $v2 -Force | Out-Null
          $env:SHULIU_PACKAGE_VERSION = "0.1.0"
          $env:SHULIU_ARTIFACTS_DIR = $v1
          corepack pnpm --filter @shuliu/desktop package:windows 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP "task26-package-v1.log")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SHULIU_PACKAGE_VERSION = "0.1.1"
          $env:SHULIU_ARTIFACTS_DIR = $v2
          corepack pnpm --filter @shuliu/desktop package:windows 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP "task26-package-v2.log")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign and verify update package with CI-only ephemeral key
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $evidence = Join-Path $env:RUNNER_TEMP "shuliu-task26-evidence"
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $installers = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP "task26-installer-v2") -File -Filter "*.exe")
          if ($installers.Count -ne 1) { throw "V2_INSTALLER_COUNT_INVALID" }
          $publicPath = Join-Path $evidence "update-verification-key.pem"
          $packagePath = Join-Path $evidence "signed-update"
          $temporaryKeyDirectory = Join-Path $env:RUNNER_TEMP ("task26-ephemeral-key-" + [guid]::NewGuid().ToString("N"))
          $privateKeyPath = Join-Path $temporaryKeyDirectory "private.pem"
          try {
            node apps/desktop/scripts/create-ci-test-signing-key.mjs $temporaryKeyDirectory
            if ($LASTEXITCODE -ne 0) { throw "CI_TEST_SIGNING_KEY_GENERATION_FAILED" }
            $env:SHULIU_UPDATE_SIGNING_PRIVATE_KEY = Get-Content -LiteralPath $privateKeyPath -Raw
            $env:SHULIU_UPDATE_SIGNING_KEY_ID = "ci-ephemeral"
            $env:SHULIU_UPDATE_TARGET_VERSION = "0.1.1"
            $env:SHULIU_UPDATE_PUBLIC_KEY_OUTPUT = $publicPath
            node apps/desktop/scripts/sign-update-package.mjs $installers[0].FullName $packagePath 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP "task26-sign-update.log")
            if ($LASTEXITCODE -ne 0) { throw "CI_TEST_PACKAGE_SIGNING_FAILED" }
            node apps/desktop/scripts/verify-update-package.mjs $packagePath $publicPath
            if ($LASTEXITCODE -ne 0) { throw "CI_TEST_PACKAGE_VERIFICATION_FAILED" }
          } finally {
            Remove-Item Env:SHULIU_UPDATE_SIGNING_PRIVATE_KEY -ErrorAction SilentlyContinue
            Remove-Item Env:SHULIU_UPDATE_SIGNING_KEY_ID -ErrorAction SilentlyContinue
            Remove-Item Env:SHULIU_UPDATE_TARGET_VERSION -ErrorAction SilentlyContinue
            Remove-Item Env:SHULIU_UPDATE_PUBLIC_KEY_OUTPUT -ErrorAction SilentlyContinue
            if (Test-Path -LiteralPath $privateKeyPath) { Remove-Item -LiteralPath $privateKeyPath -Force }
            $temporaryPublicKey = Join-Path $temporaryKeyDirectory "public.pem"
            if (Test-Path -LiteralPath $temporaryPublicKey) { Remove-Item -LiteralPath $temporaryPublicKey -Force }
            if (Test-Path -LiteralPath $temporaryKeyDirectory) { Remove-Item -LiteralPath $temporaryKeyDirectory -Force }
          }
      - name: Install and smoke-test the Windows package, Safe Mode, and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installers = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP "task26-installer-v2") -File -Filter "*.exe")
          if ($installers.Count -ne 1) { throw "V2_INSTALLER_COUNT_INVALID" }
          $evidence = Join-Path $env:RUNNER_TEMP "shuliu-task26-evidence\installer-smoke"
          pwsh -NoProfile -File tests/e2e/windows/test_installer_smoke.ps1 -InstallerPath $installers[0].FullName -EvidenceDirectory $evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify upgrade, failed-runtime Safe Mode, rollback, and data preservation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $previous = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP "task26-installer-v1") -File -Filter "*.exe")
          $next = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP "task26-installer-v2") -File -Filter "*.exe")
          if ($previous.Count -ne 1 -or $next.Count -ne 1) { throw "INSTALLER_COUNT_INVALID" }
          $evidence = Join-Path $env:RUNNER_TEMP "shuliu-task26-evidence\upgrade-rollback"
          pwsh -NoProfile -File tests/e2e/windows/test_upgrade_rollback.ps1 -PreviousInstallerPath $previous[0].FullName -NextInstallerPath $next[0].FullName -EvidenceDirectory $evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Task 26 installers, reports, logs, and signed update evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: task26-windows-installers-and-evidence
          path: |
            ${{ runner.temp }}/task26-installer-v1/*.exe
            ${{ runner.temp }}/task26-installer-v2/*.exe
            ${{ runner.temp }}/task26-desktop-tests.xml
            ${{ runner.temp }}/task26-pyinstaller.log
            ${{ runner.temp }}/task26-package-v1.log
            ${{ runner.temp }}/task26-package-v2.log
            ${{ runner.temp }}/task26-sign-update.log
            ${{ runner.temp }}/shuliu-task26-evidence/**
          if-no-files-found: warn
      - name: Confirm Windows runner
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -ne "Windows") { throw "Windows-only validation ran on the wrong runner" }
          Write-Output "Task 26 package, install, health, upgrade, Safe Mode, rollback, and uninstall gates ran on Windows."

  windows-gate-report:
    name: Windows release gate report
    needs: [windows-validation]
    if: always()
    runs-on: windows-latest
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Derive gate results from run conclusions and aggregate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # The windows runner's system Python does not ship PyYAML.
          python -m pip install pyyaml --quiet --disable-pip-version-check
          python tests/release/ci_gate_report.py `
            --repo "$env:GITHUB_REPOSITORY" `
            --run-id "$env:GITHUB_RUN_ID" `
            --commit "$env:GITHUB_SHA" `
            --out gate-report-windows.json `
            --summary gate-summary-windows.md
          Get-Content gate-summary-windows.md | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-report-windows
          path: |
            gate-report-windows.json
            gate-summary-windows.md
