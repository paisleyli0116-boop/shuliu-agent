name: Generic CI

on:
  workflow_dispatch:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  generic:
    name: Generic tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version-file: pyproject.toml
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --all-packages
      - name: Run Cloud API identity unit tests
        run: uv run --locked --package shuliu-cloud-api pytest services/cloud-api/tests/identity -q
      - name: Run Cloud API route and authorization tests
        run: uv run --locked --package shuliu-cloud-api pytest services/cloud-api/tests/api services/cloud-api/tests/approval -q
      - name: Run Cloud Worker lease and coordination unit tests
        run: uv run --locked --package shuliu-cloud-api pytest services/cloud-api/tests/workers -q -m "not integration"
      - name: Run Python Policy unit tests
        run: uv run --locked --package shuliu-python-runtime pytest runtimes/python-worker/tests/policy -q
      - name: Run Python Approval unit tests
        run: uv run --locked --package shuliu-python-runtime pytest runtimes/python-worker/tests/approval -q
      - name: Run Python Tool Broker and MCP unit tests
        run: uv run --locked --package shuliu-python-runtime pytest runtimes/python-worker/tests/tools -q
      - name: Run Python Agent Core unit tests
        run: uv run --locked --package shuliu-python-runtime pytest runtimes/python-worker/tests/agent -q
      - name: Run Python Workflow unit tests
        run: uv run --locked --package shuliu-python-runtime pytest runtimes/python-worker/tests/workflow -q
      - name: Run Python Model Gateway unit tests
        run: uv run --locked --package shuliu-python-runtime pytest runtimes/python-worker/tests/models -q
      - name: Run Python Worker protocol and registration unit tests
        run: uv run --locked --package shuliu-python-runtime pytest runtimes/python-worker/tests/worker -q
      - name: Run Python Skill lifecycle and process isolation tests
        run: uv run --locked --package shuliu-python-runtime pytest runtimes/python-worker/tests/skills -q
      - name: Run repository security tests
        run: pnpm test:security
      - name: Run TypeScript unit and Browser Fake contract tests
        run: pnpm test:unit
      - name: Run Electron ↔ Python IPC tests with real subprocesses
        run: pnpm test:ipc
      - name: Run Desktop UI, IPC, and security unit tests
        run: pnpm --filter @shuliu/desktop test
      - name: Typecheck Electron Main, Preload, and Renderer
        run: pnpm --filter @shuliu/desktop typecheck
      - name: Build unpackaged Desktop Main, Preload, and Renderer
        run: pnpm --filter @shuliu/desktop build
      - name: Run Cloud API Knowledge unit tests
        run: uv run --locked --package shuliu-cloud-api pytest services/cloud-api/tests/knowledge -q
      - run: pnpm test:contract
      - run: pnpm test:migration
      - name: Run generic integration tests without the dedicated real-browser suite
        run: |
          pnpm exec vitest run tests/integration --passWithNoTests
          uvx --from uv==0.12.20 uv run --locked --all-packages pytest -m "integration and not real_browser and not postgres"
      - run: pnpm typecheck

  postgres-migration:
    name: PostgreSQL migration (PG ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [17, 18]
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg${{ matrix.postgres }}-bookworm
        env:
          POSTGRES_DB: shuliu_test
          POSTGRES_USER: shuliu
          POSTGRES_PASSWORD: shuliu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shuliu -d shuliu_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SHULIU_DATABASE_URL: postgresql+psycopg://shuliu:shuliu@localhost:5432/shuliu_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version-file: pyproject.toml
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --all-packages
      - run: pnpm test:migration
      - name: Run durable model usage and budget integration tests
        run: uv run --locked --all-packages pytest tests/integration/test_model_usage_persistence.py -q
      - name: Run durable Tool idempotency restart and concurrency integration tests
        run: uv run --locked --all-packages pytest tests/integration/test_postgres_tool_idempotency.py tests/integration/test_tool_idempotency_crash.py -q
      - name: Run PostgreSQL Knowledge unit and revocation tests
        run: uv run --locked --package shuliu-cloud-api pytest services/cloud-api/tests/knowledge -q
      - name: Run PostgreSQL Knowledge ACL integration tests
        run: uv run --locked --package shuliu-cloud-api pytest tests/integration/test_knowledge_permissions.py tests/integration/test_knowledge_server_rbac.py -q
      - name: Run PostgreSQL Worker lease concurrency tests
        run: uv run --locked --package shuliu-cloud-api pytest services/cloud-api/tests/workers -q -m integration
